appId: dev.scriptty.app
productName: Scriptty
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
extraResources:
  - from: resources/runner
    to: runner
  # Editor types (see Packages.types and BUNDLED_TYPES in src/main/index.ts): node: built-ins, the Bun global,
  # and undici-types, which both reference. Only .d.ts files and package.json, no docs.
  - from: node_modules/@types/node
    to: types/node
    filter: ["**/*.d.ts", "package.json"]
  - from: node_modules/bun-types
    to: types/bun
    filter: ["**/*.d.ts", "package.json", "!test-globals.d.ts", "!ts7.1"]
  - from: node_modules/undici-types
    to: types/undici
    filter: ["**/*.d.ts", "package.json"]
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Each build ships only the bun binary installed on the build machine, so build each arch on its own runner.
  extraResources:
    - from: node_modules/bun/bin/bun.exe
      to: bin/bun
  hardenedRuntime: true
  notarize: false # set true once the Apple Developer ID is in CI
win:
  target:
    - nsis
  extraResources:
    - from: node_modules/bun/bin/bun.exe
      to: bin/bun.exe
  # azureSignOptions: add once Azure Trusted Signing is set up
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
